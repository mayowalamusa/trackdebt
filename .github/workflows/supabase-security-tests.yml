name: Supabase Security Tests

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-security-tests.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-security-tests.yml"

jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Run database security tests
        run: supabase test db supabase/tests/trackdebt_security_rls.test.sql
